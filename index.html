<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>JRichForms XR — Untitled No. 7</title>
  <link rel="stylesheet" href="css/styles.css" />

  <!--
    ── 8th Wall engine + Three.js ────────────────────────────────────────────
    The engine runs its computer-vision tracking as a WASM runtime over the
    camera feed. iOS Safari has no WebXR, so this WASM pipeline is what makes
    in-browser AR possible on iPhone.

    IMPORTANT (Milestone 0): the old hosted `appKey` CDN model was retired when
    8th Wall went open source (Feb 2026). Reconcile the two includes below with
    the CURRENT engine docs before expecting this to run:
      • Engine overview: https://8thwall.org/docs/engine/overview
      • Repo:            https://github.com/8thwall/8thwall  (packages/engine, packages/xrextras)
      • SLAM binary:     https://8th.io/xrjs  (NOT needed for image-target-only mode)

    Self-host approach: build/copy the engine + xrextras bundles from the repo
    into /vendor and point these tags at them. Placeholder paths shown.
  -->
  <script src="vendor/xrextras.js"></script>
  <script src="vendor/8thwall-engine.js"></script>

  <!-- Three.js (pin a version your engine build supports) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- GLTFLoader is not in the core three.min build; vendor it or use a module build. -->
  <script src="vendor/GLTFLoader.js"></script>

  <!-- App code -->
  <script defer src="js/config.js"></script>
  <script defer src="js/scene.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <!-- Camera feed target -->
  <canvas id="camerafeed"></canvas>

  <!-- Start gate: iOS requires a user gesture before camera + audio -->
  <div id="start-gate" class="overlay">
    <div class="gate-card">
      <h1>The Stone Speaks Spatially</h1>
      <p>Point your phone at the marker beside the sculpture.</p>
      <button id="start-btn">Begin</button>
      <small>Camera access is required. Nothing is recorded.</small>
    </div>
  </div>

  <!-- Scanning hint -->
  <div id="scan-hint" class="hint hidden">
    <div class="reticle"></div>
    <p>Aim at the marker…</p>
  </div>

  <!-- Tap prompt (shown when a model is anchored) -->
  <div id="tap-prompt" class="prompt hidden">Tap the piece to reveal the raw stone</div>

  <!-- Provenance card -->
  <div id="provenance" class="panel hidden">
    <button class="panel-close" id="prov-close">×</button>
    <h2 id="prov-title"></h2>
    <dl id="prov-fields"></dl>
    <a id="prov-acquire" class="cta" href="#" target="_blank" rel="noopener">Inquire to acquire</a>
  </div>

  <!-- Narration control -->
  <audio id="narration" preload="auto" playsinline></audio>
</body>
</html>
